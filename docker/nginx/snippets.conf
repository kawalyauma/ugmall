# Shared by the storefront and admin server blocks.

# Public media straight from disk — Node never touches image bytes.
# Only public areas are exposed; invoices/receipts/customers/returns are not.
location ~ ^/media/((products|categories|brands|reviews)/[A-Za-z0-9._/-]+\.(webp|jpg|jpeg|png|gif|avif))$ {
  alias /srv/storage/$1;
  expires 365d;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options nosniff;
  access_log off;
}
location /media/ { return 404; }

# Private files: the API checks the signed link, then hands off here.
location /_protected/ {
  internal;
  alias /srv/storage/;
  add_header Cache-Control "private, no-store";
  add_header X-Content-Type-Options nosniff;
}

# Upstreams are resolved per request (resolver 127.0.0.11) so redeploying a
# container, which changes its IP, never leaves Nginx pointing at a dead one.
set $api_upstream api:4000;

location /api/admin/auth/login {
  limit_req zone=auth burst=5 nodelay;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$api_upstream;
  include /etc/nginx/proxy.conf;
}
location /api/store/account/otp/ {
  limit_req zone=auth burst=5 nodelay;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$api_upstream;
  include /etc/nginx/proxy.conf;
}
location /api/admin/imports/ {
  client_max_body_size 25m;
  proxy_read_timeout 300s;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$api_upstream;
  include /etc/nginx/proxy.conf;
}
location /api/ {
  limit_req zone=api burst=60 nodelay;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$api_upstream;
  include /etc/nginx/proxy.conf;
}

location /_next/static/ {
  proxy_pass http://$next_upstream;
  include /etc/nginx/proxy.conf;
  expires 365d;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
  proxy_pass http://$next_upstream;
  include /etc/nginx/proxy.conf;
}
